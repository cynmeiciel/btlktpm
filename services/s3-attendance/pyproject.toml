[project]
name = "tmc-attendance"
version = "0.1.0"
description = "TMC S3 Attendance service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "import-linter>=2.0",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tmc_attendance"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # isort
  "N",             # pep8-naming
  "UP",            # pyupgrade
  "B",             # bugbear
  "SIM", "C4",     # simplifications
  "DTZ",           # forbid naive datetime
  "S",             # bandit (security)
  "PT",            # pytest style
  "RUF",
  "ARG",           # unused arguments
  "T20",           # no print in src
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ARG001", "ARG002"]
"scripts/**" = ["T20", "S"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

# Production code is fully typed; tests may skip annotations to stay quick to write.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: domain and application tests with fakes",
  "api: HTTP tests with fake container",
  "integration: outbound adapters against real PostgreSQL",
  "e2e: full stack against real PostgreSQL",
]
filterwarnings = ["error"]
timeout = 30

[tool.coverage.run]
branch = true
source = ["tmc_attendance"]

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
  "\\.\\.\\.",
]

[tool.importlinter]
root_package = "tmc_attendance"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers (DP09 / ADR05)"
type = "layers"
layers = [
  "tmc_attendance.bootstrap",
  "tmc_attendance.adapters",
  "tmc_attendance.application",
  "tmc_attendance.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is framework-free"
type = "forbidden"
source_modules = ["tmc_attendance.domain"]
forbidden_modules = [
  "fastapi", "starlette", "pydantic", "pydantic_settings",
  "sqlalchemy", "psycopg", "alembic", "httpx", "httpx2", "uvicorn",
]

[[tool.importlinter.contracts]]
name = "Application is framework-free"
type = "forbidden"
source_modules = ["tmc_attendance.application"]
forbidden_modules = [
  "fastapi", "starlette", "pydantic", "pydantic_settings",
  "sqlalchemy", "psycopg", "alembic", "httpx", "httpx2", "uvicorn",
]

[[tool.importlinter.contracts]]
name = "Inbound and outbound adapters are independent"
type = "independence"
modules = [
  "tmc_attendance.adapters.inbound",
  "tmc_attendance.adapters.outbound",
]
