# Alembic for S3 Attendance. The database URL is NOT stored here:
# migrations/env.py reads TMC_S3_MIGRATION_DATABASE_URL via DatabaseAdminSettings.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Revision files are named <rev>_<slug>.py; create with an explicit id, e.g.
#   uv run alembic revision --rev-id 0001 -m "create attendance schema"
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
